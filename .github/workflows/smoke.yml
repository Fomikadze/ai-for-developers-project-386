name: smoke

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check backend exists
        id: present
        run: echo "found=$([ -f backend/gradlew ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@v5
        if: steps.present.outputs.found == 'true'
        with:
          install_args: java

      - uses: gradle/actions/setup-gradle@v6
        if: steps.present.outputs.found == 'true'

      - name: Smoke test
        if: steps.present.outputs.found == 'true'
        run: mise run smoke
